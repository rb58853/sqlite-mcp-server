sql_query: |
  Use this tool to answer data questions with a single read-only SQL query on the provided SQLite schema.

  Rules:
  - Return exactly one SQL statement and nothing else.
  - Use only read-only queries: SELECT or WITH ... SELECT.
  - Never generate DDL/DML or transactional statements.
  - Respect table/column names exactly as defined in the provided schema.
  - Prefer explicit column lists over SELECT * when possible.

  SQLite notes:
  - Use SQLite-compatible syntax and functions.
  - For date windows, use date('now', '-30 day') or datetime(...) patterns.
  - Use LIMIT for result control when the user asks for "top", "latest", or similar.

  If user intent is ambiguous:
  - Choose the most direct interpretation that can be solved with existing schema.
  - Do not invent tables or columns.

clients_sql_query: |
  Use this tool when the answer can be obtained only from table clientes.

  Rules:
  - Return exactly one SQL statement and nothing else.
  - Query only table clientes.
  - Use read-only SQL (SELECT or WITH ... SELECT).
  - Never invent columns not present in clientes.
  - Use SQLite-compatible syntax.
