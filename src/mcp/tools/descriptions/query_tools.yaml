sql_query: |
  Esta herramenta sirve para recuperar la informacion necesaria de las tablas proporcionadas usando como entrada consultas SQL de solo lectura (SELECT) para ejecutar directamente contra una base de datos. Solo debe usarse para los casos que se pueda recuperar la informacion pedida desde las tablas que se proporcionan, en caso de que la informacion no pueda estar en el esquema proporcionado, entonces no se debe usar esta herramienta.
  
  INPUT:
  - Recibe una consulta SQL valida para ejecutar directamente contra la base de datos que posee el esquema proporcionado.
  
  OUTPUT:
  - informacion recuperada desde la base de datos al usar la consulta SQL de entrada.
  
  INSTRUCCIONES GENERALES:
  - Única responsabilidad: generar una consulta SQL válida que responda a la petición del usuario.
  - No explica la consulta, no agrega comentarios, texto adicional ni formato fuera del SQL.
  - Devuelve siempre y solo una instrucción SQL completa terminada en punto y coma (;).
  - Si no puede responder con un SELECT razonable, devuelve exactamente: SELECT 1;
  - Solo genera sentencias que comiencen con SELECT.

  ESTILO DE LA QUERY:
  - Usa siempre la forma: SELECT ... FROM ... con cláusulas necesarias (WHERE, GROUP BY, HAVING, ORDER BY, LIMIT/OFFSET).
  - Usa alias claros y sencillos para tablas y columnas cuando hace falta.
  - Si se piden varias métricas o agrupaciones, utiliza agregaciones estándar (COUNT, SUM, AVG, MIN, MAX, etc.).
  - Si la petición es ambigua, elige la interpretación más sencilla y razonable y refleja esa interpretación en la estructura de la consulta.

  EJEMPLOS DE COMPORTAMIENTO ESPERADO:
  - Petición: "Dame los últimos 10 usuarios registrados."
    Consulta Generada:
    SELECT * FROM users ORDER BY created_at DESC LIMIT 10;

  - Petición: "Cuántos pedidos completados hubo por día el último mes."
    Consulta Generada:
    SELECT
      DATE(order_date) AS order_day,
      COUNT(*) AS completed_orders
    FROM orders
    WHERE status = 'completed'
      AND order_date >= CURRENT_DATE - INTERVAL '30 days'
    GROUP BY DATE(order_date)
    ORDER BY order_day;

  RECORDATORIO FINAL:
  - El esquema o lista de tablas/columnas proporcionado debe ser respetado estrictamente y no inventar tablas ni columnas.
  - Generar siempre con una única sentencia SELECT completa terminada en punto y coma.

clients_sql_query: |
  Esta herramenta sirve para recuperar la informacion necesaria desde la tabla de clientes proporcionadas usando como entrada consultas SQL de solo lectura (SELECT) para ejecutar directamente contra esta base de datos. Solo debe usarse para los casos que se pueda recuperar la informacion pedida desde la tabla de los clientes, en caso de que la informacion no pueda estar en esta tabla proporcionada, entonces no se debe usar esta herramienta.

  INPUT:
  - Recibe una consulta SQL valida para ejecutar directamente contra la base de datos que posee la tabla clientes proporcionada.
  
  OUTPUT:
  - informacion recuperada desde la base de datos al usar la consulta SQL de entrada. 
  
  INSTRUCCIONES GENERALES:
  - Única responsabilidad: generar una consulta SQL válida que responda exactamente a la solicitud del usuario.
  - No explica la consulta, no incluye texto adicional, comentarios ni formato fuera del SQL.
  - Devuelve siempre y solo una instrucción SQL completa terminada en punto y coma (;).
  - Solo genera sentencias que comiencen con SELECT.
  - Solo consulta la tabla "clientes".
  - No inventa otras tablas ni columnas que no existan en "clientes".

  ESTILO DE LA QUERY:
  - Usa siempre la estructura: SELECT ... FROM clientes ... con cláusulas necesarias (WHERE, GROUP BY, HAVING, ORDER BY, LIMIT, OFFSET).
  - Utiliza alias claros y consistentes solo cuando sea necesario.
  - Aplica funciones de agregación estándar para métricas (COUNT, SUM, AVG, MIN, MAX, etc.).
  - Si la petición es ambigua, elige la interpretación más directa y lógica y la refleja en la consulta.

  EJEMPLOS DE COMPORTAMIENTO ESPERADO:
  - Petición: "Cuántos clientes hay en cada pais."
    Respuesta:
    SELECT pais, COUNT(*) AS total_clientes FROM clientes GROUP BY pais ORDER BY total_clientes DESC;

  - Petición: "Actualiza el correo de un cliente."
    Respuesta:
    SELECT 'Solo se permiten consultas de lectura (SELECT).' AS error_message;

  RECORDATORIO FINAL:
  - Generar siempre una única sentencia SELECT completa finalizada con punto y coma, para ser usada como input.
  - Nunca añade texto fuera del SQL.
